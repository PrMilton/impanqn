.cult-instructions>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:16px;font-weight:750;font-size:var(--reading)}
.cult-instructions[open]>summary>.chevron{transform:rotate(180deg)}

.number { font-family:Georgia,serif; font-size:2.5rem; line-height:1; font-weight:700; background:none; min-width:1.15em; height:auto; letter-spacing:-.06em; border-radius:0; }
.phrase { border:1px solid var(--line); border-radius:10px; margin-top:16px; overflow:clip; }
.phrase>summary { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; font-size:.9375rem; font-weight:650; min-height:48px; }
.phrase[open]>summary>.chevron { transform:rotate(180deg); }
.phrase .quote { margin:0; border-radius:0; }
.theme { width:46px; height:46px; padding:10px; display:grid; place-items:center; }
@media(max-width:380px) { .phase-number { font-size:2.8rem; } .number { font-size:2.1rem; } }

<script>
const STAGES = {atrio:'ATRIO',santo:'LUGAR SANTO',santisimo:'LUGAR SANTÍSIMO',oracion:'CULTO DE ORACIÓN',pending:'SIN ETAPA ASIGNADA'};
function assignStages(document,day) {
  const clean=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const clamor=document.steps.findIndex(step=>/clamor|intercesion.*humillacion/.test(clean(step.title)));
  const message=document.steps.findIndex(step=>/mensaje.*palabra|palabra.*ministracion/.test(clean(step.title)));
  document.steps.forEach((step,index)=>{
    if(Object.prototype.hasOwnProperty.call(STAGES,step.stage))return;
    step.stage=day==='viernes'?'oracion':clamor<0||message<=clamor?'pending':index<=clamor?'atrio':index<=message?'santo':'santisimo';
  });
}

'use strict';

const ICONS={"stand":["De pie","<circle cx=\"12\" cy=\"4\" r=\"2\"/><path d=\"M12 8v7m-5-3 5-4 5 4m-5 3-4 7m4-7 4 7\"/>"],"sit":["Sentados","<circle cx=\"10\" cy=\"4\" r=\"2\"/><path d=\"M10 8v7h7v7M5 11v7h8M6 18v4\"/>"],"kneel":["De rodillas","<circle cx=\"10\" cy=\"4\" r=\"2\"/><path d=\"M10 8v7l6 6H7m3-11 5 4 4-4\"/>"],"hands":["Manos alzadas","<circle cx=\"12\" cy=\"7\" r=\"2\"/><path d=\"M12 11v7m0-6L6 8 4 2m8 10 6-4 2-6m-8 16-3 4m3-4 3 4\"/>"],"bible":["Biblia","<path d=\"M3 4h7l2 2 2-2h7v16h-7l-2 2-2-2H3zM12 6v16M6 8h3M15 8h3\"/>"],"cross":["Cruz","<path d=\"M10 2h4v6h6v4h-6v10h-4V12H4V8h6z\"/>"],"music":["Música","<path d=\"M9 18V5l11-3v14M9 9l11-3\"/><ellipse cx=\"6\" cy=\"19\" rx=\"3\" ry=\"2\"/><ellipse cx=\"17\" cy=\"17\" rx=\"3\" ry=\"2\"/>"],"offering":["Ofrenda","<path d=\"M2 16h5l3-4h7a2 2 0 0 1 0 4h-5m5 0 4-3 2 2-7 6H7l-5-2\"/><circle cx=\"13\" cy=\"5\" r=\"3\"/>"],"people":["Congregación","<circle cx=\"12\" cy=\"5\" r=\"3\"/><circle cx=\"4\" cy=\"8\" r=\"2\"/><circle cx=\"20\" cy=\"8\" r=\"2\"/><path d=\"M7 22v-7a5 5 0 0 1 10 0v7zM1 21v-7a3 3 0 0 1 5-2m17 9v-7a3 3 0 0 0-5-2\"/>"],"pulpit":["Púlpito","<path d=\"M3 8h18v4H3zM6 8l2-5h8l2 5M8 12l1 9h6l1-9M6 22h12M12 14v5m-2-3h4\"/>"],"prayer":["Oración","<path d=\"M12 3 8 8l-2 8-4 3 3 3 5-4 2-7m0-8 4 5 2 8 4 3-3 3-5-4-2-7V3\"/>"],"heart":["Gratitud","<path d=\"M12 21 3 12C-2 5 7-1 12 6c5-7 14-1 9 6z\"/>"]};

const DEFAULT_INSTRUCTIONS = [{"id":"instruction-0","title":"Antes de comenzar","text":"Revisá el orden del día y confirmá los responsables y los momentos opcionales. Acordá las indicaciones con el ministro y quienes participan.","note":"","styles":{}},{"id":"instruction-1","title":"Durante la conducción","text":"Anunciá cada transición con claridad. Indicá cuándo ponerse de pie, sentarse o arrodillarse; acompañá a quienes visitan la congregación.","note":"","styles":{}},{"id":"instruction-2","title":"Participaciones y tiempos","text":"El devocional breve y las oportunidades de gratitud quedan a criterio del coordinador. Para la gratitud, hasta tres participaciones voluntarias; si no hay participantes, continuá con el orden previsto.","note":"","styles":{}},{"id":"instruction-day","title":"Para este","text":"Seguí los responsables, las indicaciones y los tiempos detallados en el orden de este día.","note":"Las frases modelo orientan la conducción y pueden adaptarse con reverencia.","styles":{}}];
function validate(input){
 if(!input||input.version!==2||!input.days)throw Error('Datos incompatibles');
 const text=v=>{if(typeof v!=='string'||v.length>20000)throw Error('Texto inválido');return v;};
 const days={};
 for(const day of Object.keys(DAYS)){
   const doc=input.days[day];if(!doc||!Array.isArray(doc.steps)||doc.steps.length>50||!Array.isArray(doc.principles)||doc.principles.length!==4)throw Error('Documento inválido');
   days[day]={meta:{title:text(doc.meta?.title),webUrl:window.liturgyWeb.safeUrl(doc.meta?.webUrl)},steps:doc.steps.map((s,i)=>({id:typeof s.id==='string'&&/^[\w-]{1,80}$/.test(s.id)?s.id:'step-'+i,title:text(s.title),role:text(s.role),description:text(s.description),phrase:text(s.phrase),label:text(s.label),icon:own(ICONS,s.icon)?s.icon:'stand',included:s.included!==false,kind:['devotional','gratitude'].includes(s.kind)?s.kind:undefined,stage:own(STAGES,s.stage)?s.stage:undefined})),principles:doc.principles.map(p=>({title:text(p.title),text:text(p.text),quote:text(p.quote),note:text(p.note)}))};
   const instructions=doc.instructions??DEFAULT_INSTRUCTIONS;
   if(!Array.isArray(instructions)||instructions.length!==4)throw Error('Indicaciones inválidas');
   days[day].instructions=instructions.map(item=>({title:text(item.title),text:text(item.text),note:text(item.note)}));
   assignStages(days[day],day);
 }
 window.liturgyPdf.retainPrintFields(input,days);
 return {version:2,days,sharedWebUrl:window.liturgyWeb.sharedUrl(input),activeDay:own(DAYS,input.activeDay)?input.activeDay:'jueves'};
}
let model=validate(JSON.parse($('#viewer-data').textContent));
let day=model.activeDay,size=17;
let linked=false,toastTimer;

try {size=Math.max(16,Math.min(23,Number(localStorage.getItem('impa-viewer-size'))||17));}catch{}
if(own(DAYS,query.get('dia')))day=query.get('dia');
function cultInstructions(doc, expanded){
 const optional=doc.steps.filter(s=>['devotional','gratitude'].includes(s.kind)).map(s=>'<li><strong>'+esc(s.title)+'</strong>: '+(s.included?'incluido en el orden':'omitido en este culto')+'.</li>').join('');
 const body=doc.instructions.map((item,index)=>'<article><h3>'+esc(item.title)+(index===3?' '+esc(DAYS[day].toLowerCase()):'')+'</h3>'+(index===3&&optional?'<ul>'+optional+'</ul>':'<p>'+esc(item.text)+'</p>')+(index===3?'<p class="guide-note">'+esc(item.note)+'</p>':'')+'</article>').join('');
 return '<details class="cult-instructions" data-key="cult-instructions" '+(expanded?'open':'')+'><summary>Indicaciones para el culto '+CHEVRON+'</summary><div class="instructions-body">'+body+'</div></details>';
}
function render(keepOpen=false){
 const instructionsOpen=keepOpen && !!document.querySelector('.cult-instructions[open]');
 const open=new Set([...document.querySelectorAll('#stages details[open]')].map(n=>n.dataset.key));
 const doc=model.days[day],visible=doc.steps.filter(s=>s.included);
 window.liturgyWeb.update(model.sharedWebUrl);
 $('#download-pdf').title='Opciones de PDF · '+DAYS[day];$('#download-pdf').setAttribute('aria-label','Opciones de PDF · '+DAYS[day]);
 $('#day').value=day;$('#title').textContent=doc.meta.title;
 $('#order-label').textContent=day==='viernes'?'Orden de oración':'Etapas del culto';
 // Conservar el orden del editor incluso si se asigna una etapa fuera de secuencia.
 const groups=[];visible.forEach((step,index)=>{let group=groups.at(-1);if(!group||group.stage!==step.stage){group={stage:step.stage,steps:[],key:'stage-'+step.stage+'-'+groups.length};groups.push(group);}group.steps.push({step,index});});
 $('#stages').innerHTML=groups.length?groups.map((group,groupIndex)=>`<details class="stage" data-stage="${group.stage}" data-key="${group.key}" ${keepOpen?open.has(group.key)?'open':'':''}><summary><span class="phase-number" aria-hidden="true">${String(groupIndex+1).padStart(2,'0')}</span><span class="stage-heading"><h3>${STAGES[group.stage]}</h3><span>${group.steps.length} ${group.steps.length===1?'momento':'momentos'} · ${String(group.steps[0].index+1).padStart(2,'0')}–${String(group.steps.at(-1).index+1).padStart(2,'0')}</span></span>${CHEVRON}</summary><div class="moments">${group.steps.map(({step:s,index})=>`<details class="moment" data-key="step-${esc(s.id)}" ${keepOpen?open.has('step-'+s.id)?'open':'':''}><summary><span class="number">${String(index+1).padStart(2,'0')}</span><span class="moment-title">${esc(s.title)}<small>${esc(s.role)}</small></span>${CHEVRON}</summary><div class="moment-body"><span class="posture">${svg(ICONS[s.icon][1])}${esc(s.label)}</span><p class="description">${esc(s.description)}</p>${s.phrase?'<details class="phrase" data-key="phrase-'+esc(s.id)+'" '+(keepOpen&&open.has('phrase-'+s.id)?'open':'')+'><summary>Frase de conducción '+CHEVRON+'</summary><blockquote class="quote">'+esc(s.phrase)+'</blockquote></details>':''}${s.kind?'<p class="optional">Momento opcional · A criterio del coordinador</p>':''}</div></details>`).join('')}</div></details>`).join(''):'<p class="empty">No hay momentos incluidos para este día.</p>';
 $('#principles').innerHTML=doc.principles.map(p=>`<article class="principle"><h3>${esc(p.title)}</h3><p class="principle-text">${esc(p.text)}</p><blockquote>${esc(p.quote)}</blockquote><p class="principle-note">${esc(p.note)}</p></article>`).join('')+cultInstructions(doc,instructionsOpen);
}
function reading(){document.documentElement.style.setProperty('--reading',size/16+'rem');$('#smaller').disabled=size<=16;$('#larger').disabled=size>=23;try{localStorage.setItem('impa-viewer-size',String(size));}catch{}}

 $('#theme').setAttribute('aria-label',label);$('#theme').title=label;$('#theme').setAttribute('aria-pressed',String(dark));
}

const pdfButton=$('#download-pdf'),pdfOptions=$('#pdf-options');
function closePdfOptions(restoreFocus=false){pdfOptions.hidden=true;pdfButton.setAttribute('aria-expanded','false');if(restoreFocus)pdfButton.focus();}
pdfButton.onclick=()=>{const open=pdfOptions.hidden;pdfOptions.hidden=!open;pdfButton.setAttribute('aria-expanded',String(open));if(open)$('#pdf-guide').focus();};
document.addEventListener('click',e=>{if(!e.target.closest('.pdf-control'))closePdfOptions();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pdfOptions.hidden){e.preventDefault();closePdfOptions(true);}});

async function downloadCultPdf(variant){
 if(pdfButton.disabled)return;
 const selectedDay=day,snapshot=JSON.parse(JSON.stringify(model.days[day]));
 closePdfOptions(true);pdfButton.disabled=true;pdfButton.setAttribute('aria-busy','true');
 const documentName=variant==='notes'?'Anotador':'PDF';toast('Preparando '+documentName.toLowerCase()+' de '+DAYS[selectedDay]+'…');
